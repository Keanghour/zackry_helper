[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zackry-cli"
version = "0.0.1"
description = "ZACKRY CLI - project helper tools (FastAPI and Spring Boot generator)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "questionary>=2.0.0",
    "requests>=2.28.0",
    "cryptography>=42.0.0",
]

# This creates the `zackry` command after install
[project.scripts]
zackry = "zackry_cli.main:main"

[project.optional-dependencies]
test = [
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "locust>=2.24",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "reportlab>=4.1",
]

[tool.setuptools.packages.find]
include = ["zackry_cli*"]